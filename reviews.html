<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejada Construction LLC | Reviews</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <aside class="sidebar">
        <div class="brand-title">Tejada Const.</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About Us</a>
            <a href="reviews.html" class="active">Reviews</a>
            <a href="contact.html">Contact</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Client Testimonials</h1>
        <p>Leave a review about your experience with Tejada Construction LLC.</p>

        <!-- Review Submission Form -->
        <form id="reviewForm" style="margin-bottom: 2rem;">
            <label for="review_text" style="color: var(--secondary-gold);">Write a Review</label>
            <textarea id="review_text" name="review_text" rows="4" placeholder="Share your experience..." required></textarea>
            <button type="submit">Submit Review</button>
        </form>

        <h2>Recent Reviews</h2>
        <div id="reviewsContainer" class="reviews-container">
            <!-- Reviews will load dynamically here -->
        </div>

        <footer style="margin-top: 3rem;">
            © 2026 Tejada Construction LLC | Site design by Harrison AI Agents
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const reviewForm = document.getElementById('reviewForm');
            const reviewsContainer = document.getElementById('reviewsContainer');

            // Load and display saved reviews from localStorage
            function loadReviews() {
                const reviews = JSON.parse(localStorage.getItem('tc_reviews') || '[]');
                if (reviews.length === 0) {
                    reviewsContainer.innerHTML = '<p style="color: var(--text-muted);">No reviews yet. Be the first to leave one!</p>';
                    return;
                }

                reviewsContainer.innerHTML = reviews.map(r => `
                    <div class="card" style="margin-bottom: 1rem;">
                        <p style="margin-bottom: 0.5rem; color: var(--text-light);">"${escapeHtml(r.text)}"</p>
                        <small style="color: var(--secondary-gold);">— Submitted on ${r.date}</small>
                    </div>
                `).join('');
            }

            // Prevent XSS attacks when rendering free text
            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;")
                          .replace(/</g, "&lt;")
                          .replace(/>/g, "&gt;")
                          .replace(/"/g, "&quot;")
                          .replace(/'/g, "&#039;");
            }

            // Capture free text submission and write to localStorage
            reviewForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const textarea = document.getElementById('review_text');
                const reviewText = textarea.value.trim();

                if (!reviewText) return;

                const reviews = JSON.parse(localStorage.getItem('tc_reviews') || '[]');
                const newReview = {
                    text: reviewText,
                    date: new Date().toLocaleString()
                };

                reviews.unshift(newReview); // Add new review at the top
                localStorage.setItem('tc_reviews', JSON.stringify(reviews));

                textarea.value = '';
                loadReviews();
            });

            // Initial load of reviews
            loadReviews();
        });
    </script>
</body>
</html>
